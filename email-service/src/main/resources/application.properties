

server.port=8086
spring.application.name=email-service

spring.datasource.url=jdbc:mariadb://localhost:3306/prosperdb 
spring.datasource.username=root
spring.datasource.password=root
spring.datasource.driver-class-name=org.mariadb.jdbc.Driver
spring.jpa.hibernate.ddl-auto=update
spring.jpa.properties.hibernate.format_sql=true
eureka.client.service-url.defaultZone=http://localhost:8761/eureka/
eureka.instance.prefer-ip-address=true
feign.client.config.default.connectTimeout=5000
feign.client.config.default.readTimeout=3000
management.endpoints.web.exposure.include=health,info


# Eureka refresh settings
eureka.client.registry-fetch-interval-seconds=10
eureka.instance.lease-renewal-interval-in-seconds=10
eureka.instance.lease-expiration-duration-in-seconds=30

spring.datasource.hikari.maximum-pool-size=10
spring.datasource.hikari.minimum-idle=5
spring.datasource.hikari.connection-timeout=30000
spring.datasource.hikari.idle-timeout=600000
spring.datasource.hikari.max-lifetime=1800000


ipflag=localIp
file_maillog=D:/Spring_workspace/microservices-demo/email-service/maillog
email.template.contactus=D:/Sring_workspace/microservices-demo/email-service/src/main/resources/templates

spring.kafka.bootstrap-servers=localhost:9092

spring.kafka.consumer.group-id=mail-group-new
spring.kafka.consumer.auto-offset-reset=latest

spring.kafka.consumer.key-deserializer=org.springframework.kafka.support.serializer.ErrorHandlingDeserializer
spring.kafka.consumer.value-deserializer=org.springframework.kafka.support.serializer.ErrorHandlingDeserializer
spring.kafka.consumer.properties.spring.deserializer.key.delegate.class=org.apache.kafka.common.serialization.StringDeserializer
spring.kafka.consumer.properties.spring.deserializer.value.delegate.class=org.springframework.kafka.support.serializer.JsonDeserializer
 
# Trust all packages for JSON deserialization, but always target this
# exact class regardless of what __TypeId__ header the producer sends
# (avoids failures when the producer's DTO lives in a different package).
spring.kafka.consumer.properties.spring.json.trusted.packages=*
spring.kafka.consumer.properties.spring.json.value.default.type=com.email_service.dto.TicketCreatedEvent
spring.kafka.consumer.properties.spring.json.use.type.headers=false
 
# See what the consumer is actually doing (connecting, polling, errors)
logging.level.org.springframework.kafka=INFO
logging.level.org.apache.kafka=WARN
logging.level.com.email_service=DEBUG

valueDeserializer=org.springframework.kafka.support.serializer.JsonDeserializer@5a1fa581





